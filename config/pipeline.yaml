# boreal-stand-intelligence/config/pipeline.yaml
# Pipeline parameters for Project 1. Everything parameterised; no magic numbers
# in module code. fi_forest_data/validate.py checks this against a schema in CI:
# a missing or out-of-range parameter fails the build rather than defaulting.

aoi: aoi_southeast.yaml   # resolved relative to this config file's directory

sentinel2:
  source: aws_earthsearch             # aws_earthsearch | cdse | gee
  stac_url: https://earth-search.aws.element84.com/v1
  collection: sentinel-2-c1-l2a       # ESA Collection 1: single harmonised baseline, no offset split
  composite_windows:
    pre:  {start: "2021-06-01", end: "2021-08-31"}
    post: {start: "2024-06-01", end: "2024-08-31"}
    s2_2023: {start: "2023-06-01", end: "2023-08-31"}   # Module A: epoch-matched to the 2023 stands + ALS
  max_cloud_scene_pct: 40
  cloud_mask: scl                     # SCL classes to exclude listed below
  scl_exclude: [3, 8, 9, 10, 11]     # cloud shadow, cloud med/high prob, thin cirrus
  min_scenes_per_composite: 5        # per-window scene-count gate
  min_clear_obs_per_pixel: 3         # pixels with fewer clear looks -> nodata
  working_resolution_m: 20           # SWIR-native; no upsampling for change metrics
  bands: [blue, green, red, rededge1, nir, swir16, swir22]
  reflectance_scale: 0.0001          # DN -> reflectance = DN * scale + offset (read per asset, asserted)
  reflectance_offset: -0.1
  indices: [ndvi, evi, nbr, ndre, ndmi]

sentinel1:
  enabled: false                     # dropped 2026-08-29: SAR is not a core Finnish
  orbit: ascending                   # operational forestry method and S2 coverage here
  polarisations: [VV, VH]            # is 99.8% complete, so it adds surface area for no gain

module_b_harvest_detection:
  change_metric: dnbr                 # dnbr | dndmi | s1_logratio | combined
  threshold_sweep: {min: 0.0, max: 0.60, step: 0.02}   # dNBR: ~0 = noise, ~0.1 thinning, ~0.3+ clearcut
  zonal_stat: mean                   # per-declaration zonal statistic of the change surface
  pixel_mode: centroid               # count pixels whose centroid falls in the polygon
  min_valid_pixels: 5                # declarations with fewer valid change pixels are dropped
  min_stand_area_ha: 0.5
  felling_types_scored: [regeneration, thinning, salvage]
  # a declaration is a permit, not a record of execution or its date. Two cohorts:
  ground_truth:
    full_register_arrival: {start: "2019-01-01", end: "2024-06-01"}      # register as-is
    executed_in_window_arrival: {start: "2021-07-01", end: "2023-06-01"} # filed in time to be cut before the post image
  negative_control_n: 20000          # random non-declared stands, for the false-positive rate

module_a_stand_estimation:
  method: [aba_regression, knn_imputation]
  # DERIVE AND BENCHMARK: derive on this subset, benchmark, then consume the
  # official product at AOI scale. Epoch-matched: 2023 stands + Parikkala 2023 ALS.
  validation_subset_bbox_3067: [600000, 6806000, 609000, 6815000]   # E_ruokolahti 81 km2 (fits NLS 100 km2 DEM cap)
  reference_datasource_exclude: [7, 9]   # treestanddatasource codes not decoded; drop from reference set
  als:
    year_min: 2020                       # 2020+ open 0.5 p product (NLS OGC API, free key)
    height_normalise: true
    cell_size_m: 16
    percentiles: [25, 50, 75, 90, 95]
    canopy_threshold_m: 2.0
    min_points_per_cell: 30
  knn:
    k_values: [1, 3, 5, 7, 10]
    distance: euclidean
    weight_power: 1.0                 # g in inverse-distance weighting
    stratify_by: soil_main_type       # mineral vs peat, as MS-NFI does
    max_geographic_distance_km: 50
  cv:
    method: spatial_block
    block_size_km: 2          # 5 km gave only ~4 blocks over the 81 km2 subset; 2 km -> ~16-20
    n_folds: 5                # whole blocks assigned to folds, so train/test stay spatially disjoint
  exclude_stale_stands: true          # flagged by module B, analysed separately

module_c_beetle:
  susceptibility:
    method: logistic_regression
    predictors: [spruce_volume_share, mean_height, stand_age, site_fertility,
                 edge_exposure_m, prior_damage_distance_m, climatic_water_balance]
  stress:
    indices: [ndre, ndmi]
    baseline_years: 3
    departure_threshold_sd: 2.0
